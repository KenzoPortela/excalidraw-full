services:
  init-db:
    image: busybox:latest
    command: ["sh", "-c", "touch /root/data/excalidraw.db"]
    volumes:
      - excalidraw-data:/root/data
    restart: "no"

  dex:
    image: dexidp/dex:v2.38.0
    restart: unless-stopped
    # Pas de fichier monté : la config est écrite au démarrage puis rendue par
    # l'entrypoint de Dex (gomplate). Le hash est passé en base64 pour éviter
    # que Docker Compose n'interprète les `$` du hash bcrypt.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/dex.config.yaml <<'EOF'
        issuer: {{ .Env.OIDC_ISSUER }}
        storage:
          type: memory
        web:
          http: 0.0.0.0:5556
          allowedOrigins: ["*"]
        logger:
          level: info
          format: text
        enablePasswordDB: true
        staticClients:
          - id: excalidraw
            redirectURIs:
              - {{ .Env.OIDC_REDIRECT_URL }}
            name: Excalidraw
            public: true
            secret: {{ .Env.OIDC_CLIENT_SECRET }}
        staticPasswords:
          - email: {{ .Env.ADMIN_EMAIL }}
            hash: "{{ .Env.ADMIN_PASSWORD_HASH_B64 | base64.Decode }}"
            username: {{ .Env.ADMIN_USERNAME }}
            userID: {{ .Env.ADMIN_USER_ID }}
        EOF
        exec /usr/local/bin/docker-entrypoint dex serve /tmp/dex.config.yaml
    environment:
      OIDC_ISSUER: https://${AUTH_DOMAIN}
      OIDC_REDIRECT_URL: https://${DRAW_DOMAIN}/auth/callback
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: admin
      ADMIN_USER_ID: admin1234
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64}
    expose:
      - "5556"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5556/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  excalidraw:
    image: ghcr.io/betterandbetterii/excalidraw-full:latest
    restart: unless-stopped
    environment:
      # le backend lit OIDC_ISSUER_URL (handlers/auth/auth.go)
      OIDC_ISSUER_URL: https://${AUTH_DOMAIN}
      OIDC_CLIENT_ID: excalidraw
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: https://${DRAW_DOMAIN}/auth/callback
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_TYPE: sqlite
      DATA_SOURCE_NAME: /root/data/excalidraw.db
    volumes:
      - excalidraw-data:/root/data
    expose:
      - "3002"
    depends_on:
      init-db:
        condition: service_completed_successfully
      dex:
        condition: service_healthy

volumes:
  excalidraw-data:
