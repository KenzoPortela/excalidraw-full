services:
  init-db:
    image: busybox:latest
    command: ["sh", "-c", "touch /root/data/excalidraw.db"]
    volumes:
      - excalidraw-data:/root/data
    restart: "no"

  dex:
    image: dexidp/dex:v2.38.0
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      OIDC_ISSUER: https://${AUTH_DOMAIN}
      OIDC_REDIRECT_URL: https://${DRAW_DOMAIN}/auth/callback
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: admin
      ADMIN_USER_ID: admin1234
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    volumes:
      # Coolify crée le fichier à partir de `content` (sinon Docker crée un dossier)
      - type: bind
        source: ./config/dex.config.yaml
        target: /etc/dex/config.yaml
        content: |
          issuer: {{ .Env.OIDC_ISSUER }}
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
            allowedOrigins: ["*"]
          logger:
            level: info
            format: text
          enablePasswordDB: true
          staticClients:
            - id: excalidraw
              redirectURIs:
                - {{ .Env.OIDC_REDIRECT_URL }}
              name: Excalidraw
              public: true
              secret: {{ .Env.OIDC_CLIENT_SECRET }}
          staticPasswords:
            - email: {{ .Env.ADMIN_EMAIL }}
              hash: "{{ .Env.ADMIN_PASSWORD_HASH }}"
              username: {{ .Env.ADMIN_USERNAME }}
              userID: {{ .Env.ADMIN_USER_ID }}
    expose:
      - "5556"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5556/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dex-http.entrypoints=http
      - traefik.http.routers.dex-http.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.dex-http.middlewares=redirect-to-https
      - traefik.http.routers.dex-https.entrypoints=https
      - traefik.http.routers.dex-https.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.dex-https.tls=true
      - traefik.http.routers.dex-https.tls.certresolver=letsencrypt
      - traefik.http.routers.dex-https.service=dex
      - traefik.http.services.dex.loadbalancer.server.port=5556

  excalidraw:
    image: ghcr.io/betterandbetterii/excalidraw-full:latest
    restart: unless-stopped
    environment:
      # le backend lit OIDC_ISSUER_URL (handlers/auth/auth.go)
      OIDC_ISSUER_URL: https://${AUTH_DOMAIN}
      OIDC_CLIENT_ID: excalidraw
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: https://${DRAW_DOMAIN}/auth/callback
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_TYPE: sqlite
      DATA_SOURCE_NAME: /root/data/excalidraw.db
    volumes:
      - excalidraw-data:/root/data
    expose:
      - "3002"
    depends_on:
      init-db:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.draw-http.entrypoints=http
      - traefik.http.routers.draw-http.rule=Host(`${DRAW_DOMAIN}`)
      - traefik.http.routers.draw-http.middlewares=redirect-to-https
      - traefik.http.routers.draw-https.entrypoints=https
      - traefik.http.routers.draw-https.rule=Host(`${DRAW_DOMAIN}`)
      - traefik.http.routers.draw-https.tls=true
      - traefik.http.routers.draw-https.tls.certresolver=letsencrypt
      - traefik.http.routers.draw-https.service=draw
      - traefik.http.services.draw.loadbalancer.server.port=3002

volumes:
  excalidraw-data:
